name: CI – lint, test, publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff black mypy
      - run: ruff check .
      - run: black --check .
      - run: mypy --ignore-missing-imports src/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -m "not integration" -q --tb=short

  integration-tests:
    runs-on: ubuntu-latest
    services:
      rules-engine:
        image: ghcr.io/${{ github.repository }}/alert-rules-engine:latest
        ports:
          - 8000:8000
        env:
          SLACK_WEBHOOK: http://localhost:0000
          PAGERDUTY_WEBHOOK: http://localhost:0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/rules && break || sleep 2
          done
      - run: pytest tests/ -m integration -q --tb=short

  publish:
    needs: [lint, unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Push Docker image
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u $ --password-stdin
          docker build -t ghcr.io/${{ github.repository }}/alert-rules-engine:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}/alert-rules-engine:${{ github.sha }}